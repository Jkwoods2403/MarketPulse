# EIA series. Each entry was verified against its official EIA page (reference_url):
# title (used verbatim as `name`), units, frequency, and the original data source from EIA's
# "Definitions, Sources and Explanatory Notes" page for the series' table.
#
# source_series_id is EIA's APIv1-style ID (CATEGORY.SERIES.FREQ), which EIA APIv2 accepts via
# its seriesid route. Seasonal adjustment is left unset because EIA does not state it on these
# pages.
#
# max_staleness_days = the largest expected age of the latest period's end date just before
# the next scheduled release, plus a small buffer (checked against EIA release dates).

source: eia
verified_on: 2026-11-01

series:
  # --- Spot prices (daily values, published weekly by EIA) -------------------------------
  - code: wti_spot
    source_series_id: PET.RWTC.D
    name: Cushing, OK WTI Spot Price FOB
    category: crude_oil
    frequency: daily
    period_convention: business_day
    units: Dollars per Barrel
    original_source: Refinitiv, an LSEG business
    reference_url: https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&s=RWTC&f=D
    license_override: attribution_required
    max_staleness_days: 14
    notes: >-
      Third-party data (Refinitiv, an LSEG business) republished by EIA; confirm redistribution
      rights before any public deployment. Daily values are released weekly (Wednesdays), so
      the latest value can legitimately be up to ~12 days old.

  - code: brent_spot
    source_series_id: PET.RBRTE.D
    name: Europe Brent Spot Price FOB
    category: crude_oil
    frequency: daily
    period_convention: business_day
    units: Dollars per Barrel
    original_source: Refinitiv, an LSEG business
    reference_url: https://www.eia.gov/dnav/pet/hist/LeafHandler.ashx?n=PET&s=RBRTE&f=D
    license_override: attribution_required
    max_staleness_days: 14
    notes: >-
      Third-party data (Refinitiv, an LSEG business) republished by EIA; confirm redistribution
      rights before any public deployment. Daily values are released weekly (Wednesdays).

  - code: henry_hub_spot
    source_series_id: NG.RNGWHHD.D
    name: Henry Hub Natural Gas Spot Price
    category: natural_gas
    frequency: daily
    period_convention: business_day
    units: Dollars per Million Btu
    original_source: Refinitiv, an LSEG business
    reference_url: https://www.eia.gov/dnav/ng/hist/rngwhhdD.htm
    license_override: attribution_required
    max_staleness_days: 14
    notes: >-
      Third-party data (Refinitiv, an LSEG business) republished by EIA; confirm redistribution
      rights before any public deployment. Daily values are released weekly (Wednesdays).

