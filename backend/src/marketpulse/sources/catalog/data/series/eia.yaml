  # --- Natural gas ------------------------------------------------------------------------
  - code: l48_gas_storage
    source_series_id: NG.NW2_EPG0_SWO_R48_BCF.W
    name: Lower 48 States Natural Gas Working Underground Storage
    category: natural_gas
    frequency: weekly
    period_convention: week_ending_friday
    units: Billion Cubic Feet
    original_source: U.S. Energy Information Administration
    reference_url: https://www.eia.gov/dnav/ng/hist/nw2_epg0_swo_r48_bcfw.htm
    max_staleness_days: 14
    notes: >-
      Form EIA-912 "Weekly Underground Natural Gas Storage Report" from the week of
      2002-03-15. Per EIA, weeks from 1994-01-07 through 2002-02-22 are estimates derived from
      EIA monthly and American Gas Association weekly data, and the week ending 2002-03-08 is
      linearly interpolated; those periods must be flagged as estimated when ingested.

  - code: us_dry_gas_production
    source_series_id: NG.N9070US2.M
    name: U.S. Dry Natural Gas Production
    category: natural_gas
    frequency: monthly
    period_convention: month
    units: Million Cubic Feet
    original_source: U.S. Energy Information Administration
    reference_url: https://www.eia.gov/dnav/ng/hist/n9070us2m.htm
    max_staleness_days: 100
    notes: >-
      Published monthly with roughly a two-month lag (the 2026-10-30 release contained data
      through August 2026).

  - code: us_lng_exports
    source_series_id: NG.N9133US2.M
    name: Liquefied U.S. Natural Gas Exports
    category: natural_gas
    frequency: monthly
    period_convention: month
    units: Million Cubic Feet
    original_source: Office of Fossil Energy, U.S. Department of Energy
    reference_url: https://www.eia.gov/dnav/ng/hist/n9133us2m.htm
    max_staleness_days: 100
    notes: >-
      Per EIA, data from 1999 to current come from the Office of Fossil Energy, U.S. Department
      of Energy, Natural Gas Imports and Exports. Published monthly with roughly a two-month lag.
