# Alembic configuration. The database URL is NOT stored here: alembic/env.py reads it from
# environment variables via marketpulse.core.config (or from a URL passed programmatically).

[alembic]
script_location = %(here)s/alembic
file_template = %%(rev)s_%%(slug)s
path_separator = os
timezone = UTC
truncate_slug_length = 60

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
