name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, types, boundaries, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: marketpulse
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: marketpulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marketpulse -d marketpulse"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # CI-only credentials for the throwaway service container above (not secrets).
      POSTGRES_USER: marketpulse
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_DB: marketpulse
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # Database tests must run in CI; never skip them silently.
      MARKETPULSE_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: mypy (strict)
        run: uv run mypy
      - name: Module boundary contracts (ADR-0002)
        run: uv run lint-imports
      - name: Tests
        run: uv run pytest -W error

  frontend:
    name: Frontend (lint, types, tests, generated files, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies (locked)
        run: pnpm install --frozen-lockfile
      - name: ESLint
        run: pnpm lint
      - name: TypeScript
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: API types match backend/openapi.json
        run: pnpm api:check
      - name: Third-party notices are current
        run: pnpm notices:check
      - name: Production build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  infrastructure:
    name: Local Postgres service starts healthy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create CI env file (non-secret, CI-only values)
        run: |
          cp .env.example .env
          sed -i 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=ci-only-password/' .env
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Start Postgres and wait for healthcheck
        run: docker compose up -d --wait --wait-timeout 90
      - name: Verify server version and UTC timezone
        run: |
          docker compose exec -T postgres psql -U marketpulse -d marketpulse -tAc "select version();"
          docker compose exec -T postgres psql -U marketpulse -d marketpulse -tAc "show timezone;" | grep -qx "UTC"
      - name: Tear down
        if: always()
        run: docker compose down -v
